version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: krishivaani_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krishivaani}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krishivaani_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-krishivaani_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krishivaani} -d ${POSTGRES_DB:-krishivaani_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: krishivaani_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: krishivaani_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-krishivaani}:${POSTGRES_PASSWORD:-krishivaani_secure_pwd}@db:5432/${POSTGRES_DB:-krishivaani_db}
      REDIS_URL: redis://redis:6379/0
      GNANI_API_KEY: ${GNANI_API_KEY}
      GNANI_BASE_URL: ${GNANI_BASE_URL:-https://api.vachana.ai}
      SECRET_KEY: ${SECRET_KEY}
      UPLOAD_FOLDER: /app/backend/uploads
    volumes:
      - uploads_data:/app/backend/uploads
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: krishivaani_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
